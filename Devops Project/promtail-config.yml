server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: windows_security
    static_configs:
      - targets: [localhost]
        labels:
          job: windows_security
          host: windows-host
          __path__: /var/log/windows/security.log

  - job_name: windows_system
    static_configs:
      - targets: [localhost]
        labels:
          job: windows_system
          host: windows-host
          __path__: /var/log/windows/system.log

  - job_name: windows_application
    static_configs:
      - targets: [localhost]
        labels:
          job: windows_application
          host: windows-host
          __path__: /var/log/windows/application.log

  - job_name: docker_containers
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          host: windows-host
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
      - labels:
          stream:
      - output:
          source: output
